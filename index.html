<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Surabhi Silks</title>
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100dvh;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        transition: opacity 300ms ease, visibility 300ms ease;
      }
      #initial-loader.fade-out {
        opacity: 0;
        visibility: hidden;
      }
      #initial-loader img {
        width: 120px;
        height: auto;
        margin-bottom: 32px;
        opacity: 1;
      }
      #initial-loader .il-spinner {
        width: 36px;
        height: 36px;
        border: 2.5px solid #e5e5e5;
        border-top-color: #ED0103;
        border-radius: 50%;
        animation: il-spin 0.8s linear infinite;
      }
      #initial-loader .il-text {
        margin-top: 18px;
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 13px;
        color: #555555;
        letter-spacing: 0.02em;
      }
      @keyframes il-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-loader { transition: none; }
        #initial-loader .il-spinner { animation-duration: 1.5s; }
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <img src="/logo.jpg" alt="Surabhi Silks" />
      <div class="il-spinner"></div>
      <p class="il-text">Loading your collection...</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
